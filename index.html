function idbPut(key,val){return idb().then(db=>new Promise((ok,no)=>{const t=db.transaction('kv','readwrite');t.objectStore('kv').put(val,key);t.oncomplete=()=>ok();t.onerror=()=>no(t.error)})).catch(()=>{})}
function idbGet(key){return idb().then(db=>new Promise((ok,no)=>{const q=db.transaction('kv','readonly').objectStore('kv').get(key);q.onsuccess=()=>ok(q.result);q.onerror=()=>no(q.error)})).catch(()=>null)}
function save(k){try{localStorage.setItem('ms_'+k,JSON.stringify(S[k]));localStorage.setItem('ms_stamp',String(Date.now()))}catch(e){}
clearTimeout(tm[k]);tm[k]=setTimeout(()=>persistAll(),250);
clearTimeout(tm._cloud);tm._cloud=setTimeout(async()=>{try{if(dbx&&k!='ph')await dbx.doc(P(k)).set({j:JSON.stringify(S[k])})}catch(e){}},900)}
async function persistAll(){const pack={};for(const key in S)pack[key]=S[key];pack._t=Date.now();await idbPut('pack',pack)}
async function boot(){for(const k in S)try{const t=localStorage.getItem('ms_'+k);if(t)S[k]=JSON.parse(t)}catch(e){}
try{const pack=await idbGet('pack');if(pack){const stamp=Number(localStorage.getItem('ms_stamp')||0);const empty=!S.docs.length&&!S.clients.length&&!S.rep.length&&!S.cat.length;if(empty||(pack._t||0)>=stamp){for(const k of ['clients','cat','docs','cfg','seq','rep','ph'])if(pack[k]!=null)S[k]=pack[k]}}}catch(e){}

function sd(k,v){cur()[k]=v;save('docs');tt()}

function sl(k,i,f,v){const l=cur()[k][i];l[f]=v;if(f==='d'){const c=S.cat.find(c=>c.d===v);if(c&&!n(l.p)){l.p=c.p;$('#p'+k+i).value=c.p}}save('docs');tt()}
