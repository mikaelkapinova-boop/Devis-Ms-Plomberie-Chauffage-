.cmp{border-radius:24px;box-shadow:0 10px 40px #0000001f,0 0 0 1px var(--ln)}
.qc{border-radius:14px}
.flt input,.flt select{background:var(--cd)}
.b1{background:#b9783f33}.b1 i{background:var(--cu)}
#pv{background:#000000cc}.pvb{background:color-mix(in srgb,var(--bg) 85%,transparent);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border-bottom:1px solid var(--ln)}
.stamp{opacity:.85}
/* ===== v3.5 — raffinements ===== */
.ni{display:flex;align-items:center;gap:14px}.ni svg{width:22px;height:22px;flex:none;fill:none;stroke:var(--ac);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nver{display:block;color:var(--mu);font-size:12px;padding:14px 16px}.nver a{color:var(--ac);text-decoration:none}
.navtop .toplogo{max-height:44px}
#splash{position:fixed;inset:0;z-index:200;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;transition:opacity .45s ease,visibility .45s}
#splash img{width:112px;height:auto;animation:spl 1s cubic-bezier(.2,.8,.2,1) both}
#splash b{font:600 17px/1.2 -apple-system,BlinkMacSystemFont,"SF Pro Display",Inter,sans-serif;letter-spacing:-.02em;color:var(--ink);opacity:0;animation:spt .6s .35s ease forwards}
#splash.out{opacity:0;visibility:hidden}
@keyframes spl{from{opacity:0;transform:scale(.82)}to{opacity:1;transform:none}}@keyframes spt{to{opacity:.75}}
.news{position:fixed;inset:0;z-index:70;background:#0006;display:flex;align-items:flex-end;justify-content:center}.news>div{background:var(--bg);border-radius:22px 22px 0 0;padding:22px 20px calc(22px + env(safe-area-inset-bottom,0px));max-width:620px;width:100%;max-height:85vh;overflow:auto}
.news h2{margin:0 0 10px;font-size:22px;letter-spacing:-.03em}.news li{margin:6px 0;line-height:1.4}
/* connexion */
#login{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:24px;transition:opacity .3s}#login.out{opacity:0;pointer-events:none}
.lg{width:100%;max-width:360px;background:var(--cd);border-radius:26px;padding:32px 28px;text-align:center;box-shadow:0 20px 60px #0000001a}
.lgi{width:64px;height:64px;margin:0 auto 12px;display:block}
.lg h1{font-size:22px;font-weight:700;letter-spacing:-.03em;margin:0 0 4px;color:var(--ink)}.lg p{margin:0 0 22px;color:var(--mu);font-size:14px}
.lg label{display:block;text-align:left;margin:0 0 12px}.lg label span{display:block;font-size:12px;font-weight:600;color:var(--mu);margin:0 0 4px 4px}
.lg .rm{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--mu);margin:4px 0 18px}.lg .rm input{width:20px;height:20px;min-height:0;margin:0;accent-color:var(--ac)}
.lg button{width:100%;border:0;border-radius:980px;min-height:50px;background:var(--ac);color:#fff;font:inherit;font-weight:600;font-size:16px}.lg button:disabled{opacity:.6}
.lg small{display:block;min-height:18px;margin-top:12px;color:var(--rd);font-weight:500}
.seg{display:flex;background:#76768033;border-radius:12px;padding:3px;margin-top:10px}.seg button{flex:1;border:0;background:transparent;border-radius:9px;min-height:36px;font:inherit;font-size:14px;font-weight:600;color:var(--mu)}.seg button.on{background:var(--ink);color:var(--bg);box-shadow:0 1px 4px #0003}</style></head><body>
<div id="splash"><img src="img/drop-hd.png" alt=""><b>Ms Plomberie &amp; Chauffage</b></div>
<header id="hd"><button class="ib" onclick="tg()" aria-label="Menu"><span>Menu</span></button><b id="ttl"></b><button class="ib" id="ad" onclick="add()" aria-label="Ajouter"><span>Ajouter</span></button><img class="toplogo" alt="Logo"></header>
<div id="ov" onclick="tg(0)"></div>
<nav id="nv"><div class="navtop"><b class="brand">Ms Plomberie &amp; Chauffage</b><img class="toplogo" alt="Logo"></div><button class="ni" data-v="h" onclick="go('h')"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v9.5h13V10"/></svg>Accueil</button><button class="ni" data-v="a" onclick="go('a')"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z"/></svg>Assistant</button><button class="ni" data-v="d" onclick="go('d')"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3h7l5 5v13H7z"/><path d="M14 3v5h5M10 13h6M10 17h6"/></svg>Devis</button><button class="ni" data-v="f" onclick="go('f')"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/></svg>Factures</button><button class="ni" data-v="x" onclick="go('x')"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h14v16H5z"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>Rapports</button><button class="ni" data-v="c" onclick="go('c')"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>Clients</button><button class="ni" data-v="p" onclick="go('p')"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12V4h8l10 10-8 8z"/><circle cx="7.5" cy="8.5" r="1.5"/></svg>Mes tarifs</button><button class="ni" data-v="g" onclick="go('g')"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Planning</button><button class="ni" data-v="r" onclick="go('r')"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Bénéfices</button><button class="ni" data-v="t" onclick="trOpenAll();tg(0)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M9 7V4h6v3M6 7l1 14h10l1-14M10 11v6M14 11v6"/></svg>Corbeille</button><button class="ni" data-v="s" onclick="go('s')"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1 7 17M17 7l2.1-2.1"/></svg>Réglages</button><small class="nver">Version 4.0 · <a href="#" onclick="newsShow();return false">Nouveautés</a></small></nav>
<main id="app"></main><div id="bar"></div>
<div id="pv"><div class="pvb"><button class="b gh sm" onclick="pvx()"><span>Fermer l'aperçu</span></button><button class="b cu sm" onclick="pdf()"><span>Télécharger le PDF</span></button><img class="toplogo" alt="Logo"></div><div id="pvw"><div id="pvh"><div id="pvs"></div></div></div></div>
<div id="ts"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="js/logo.js"></script>
<script>
try{const rr='/Devis-Ms-Plomberie-Chauffage-/';const r=sessionStorage.getItem('msplomberie_redirect');const atRoot=location.pathname===rr||location.pathname===rr.replace(/\/$/,'');if(r&&atRoot){history.replaceState(null,'',new URL(rr.replace(/\/$/,'')+(r.startsWith('/')?r:`/${r}`),location.origin).toString());sessionStorage.removeItem('msplomberie_redirect')}}catch(e){}
const $=s=>document.querySelector(s),nw=()=>Math.random().toString(36).slice(2,9),n=v=>parseFloat(String(v).replace(',','.'))||0,
E=v=>v.toLocaleString('fr-FR',{minimumFractionDigits:2,maximumFractionDigits:2})+' €',
esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),
td=()=>new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10),
fd=s=>s?s.split('-').reverse().join('/'):'',
sum=L=>L.reduce((s,l)=>s+n(l.q)*n(l.p),0),
tot=d=>{const s=sum(d.F)+sum(d.M),m=s*n(d.rm)/100,ht=s-m,tv=ht*n(d.tva)/100,t=ht+tv,a=t*n(d.acc)/100;return{s,m,ht,tv,t,a,r:d.paid?0:d.ap?t-a:t}},
cur=()=>(V.v==='xe'?S.rep:S.docs).find(x=>x.id===V.id),
bdg=d=>d.t==='d'?(d.st==='fac'?'<span class="bd ok">Facturé</span>':d.st==='ok'?'<span class="bd cu">Accepté</span>':'<span class="bd">En attente</span>'):d.paid?'<span class="bd st">PAYÉ</span>':d.ap?`<span class="bd cu">Reste ${E(tot(d).r)}</span>`:'<span class="bd rd">À payer</span>';
let S={clients:[],cat:[],docs:[],cfg:{cot:21.5,imp:0,val:30,acc:40},seq:{},rep:[],ph:{},chat:[],plan:[]},V={v:'h'},R={n:6},CE,tm={},arm;
function idb(){return new Promise((ok,no)=>{const r=indexedDB.open('msplomberie',1);r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains('kv'))r.result.createObjectStore('kv')};r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})}
function idbPut(key,val){return idb().then(db=>new Promise((ok,no)=>{const t=db.transaction('kv','readwrite');t.objectStore('kv').put(val,key);t.oncomplete=()=>ok();t.onerror=()=>no(t.error)})).catch(()=>{})}
function idbGet(key){return idb().then(db=>new Promise((ok,no)=>{const q=db.transaction('kv','readonly').objectStore('kv').get(key);q.onsuccess=()=>ok(q.result);q.onerror=()=>no(q.error)})).catch(()=>null)}
function save(k){try{localStorage.setItem('ms_'+k,JSON.stringify(S[k]));localStorage.setItem('ms_stamp',String(Date.now()))}catch(e){}
clearTimeout(tm[k]);tm[k]=setTimeout(()=>persistAll(),250);
if(k!=='ph'&&k!=='chat')ghSched()}
async function persistAll(){const pack={};for(const key in S)pack[key]=S[key];pack._t=Date.now();await idbPut('pack',pack)}
async function boot(){for(const k in S)try{const t=localStorage.getItem('ms_'+k);if(t)S[k]=JSON.parse(t)}catch(e){}
try{const pack=await idbGet('pack');if(pack){const stamp=Number(localStorage.getItem('ms_stamp')||0);const empty=!S.docs.length&&!S.clients.length&&!S.rep.length&&!S.cat.length;if(empty||(pack._t||0)>=stamp){for(const k of ['clients','cat','docs','cfg','seq','rep','ph','chat','plan'])if(pack[k]!=null)S[k]=pack[k]}}}catch(e){}
cfgInit();applyTheme();render();pwa();if(typeof impHash==='function')impHash();inbxLoad().then(()=>{inbxRender();homeInbx()});ghPull(0)}
function toast(m){const t=$('#ts');t.textContent=m;t.style.opacity=1;setTimeout(()=>t.style.opacity=0,2400)}
function arm2(b,fn){if(arm===b){arm=null;fn()}else{arm=b;b.textContent='Confirmer ?';setTimeout(()=>{if(arm===b){arm=null;b.textContent=b.dataset.t}},3000)}}
function tg(o){const on=o===undefined?!$('#nv').classList.contains('o'):!!o;$('#nv').classList.toggle('o',on);$('#ov').classList.toggle('o',on);document.body.classList.toggle('lk',on)}
function go(v,id){V={v,id};tg(0);render();scrollTo(0,0)}
function render(){const t=V.v,d=t==='e'?cur():0;
if(t==='e'&&!d){V.v='d';return render()}
document.querySelectorAll('.ni').forEach(b=>b.classList.toggle('a',b.dataset.v===(d?d.t:t[0])));
$('#ttl').textContent={d:'Devis',f:'Factures',c:'Clients',p:'Mes tarifs',r:'Bénéfices',h:'Accueil',x:'Rapports',xe:'Rapport',e:d&&d.t==='f'?'Facture':'Devis',ce:'Client',a:'Assistant',s:'Réglages',g:'Planning'}[t];
document.querySelectorAll('.toplogo').forEach(im=>{ if(!im.dataset.ok){ im.src=LGD; im.dataset.ok='1' } });
$('#ad').style.display=['r','e','ce','h','xe','a','s'].includes(t)?'none':'';
$('#app').innerHTML=({d:list,f:list,c:cli,p:tar,r:rap,e:edit,ce:cliE,h:home,x:rlist,xe:redit,a:chatV,s:setV,g:plV})[t]();
const b=$('#bar');b.style.display=d?'flex':'none';
if(d)b.innerHTML=`<button class="b gh" onclick="pvo()"><span>Voir l'aperçu</span></button><button class="b" onclick="pdf()"><span>Télécharger le PDF</span></button>${d.t==='f'?`<button class="b cu" onclick="pay(!cur().paid);render()"><span>${d.paid?'Annuler le paiement':'Marquer payée'}</span></button>`:`<button class="b cu" onclick="conv()"><span>Créer la facture</span></button>`}<button class="b gh" onclick="shr()"><span>Partager le PDF</span></button>`;
if(t==='xe'){b.style.display='flex';b.innerHTML='<button class="b gh" onclick="pvo()"><span>Voir l\'aperçu</span></button><button class="b" onclick="pdf()"><span>Télécharger le PDF</span></button><button class="b gh" onclick="shr()"><span>Partager le PDF</span></button>'}
if(t==='a')chatAfter();if(t==='h')homeInbx();
if(t==='r')rbd()}
function add(){const t=V.v;if(t==='c')return go('ce','new');if(t==='x')return nr();if(t==='p')return catAdd();if(t==='g')return plNew();nd(t)}
function nd(t){const y=new Date().getFullYear(),k=t+y,q=S.seq[k]=(S.seq[k]||0)+1,d={id:nw(),t,num:(t==='d'?'DEV-':'FAC-')+y+'-'+String(q).padStart(3,'0'),date:td(),val:S.cfg.val,cn:'',ca:'',cc:'',ct:'',sn:'',sa:'',sc:'',o:'',F:[{d:'',q:1,p:''}],M:[{d:'',q:1,p:''}],acc:S.cfg.acc,ap:false,paid:false,pd:'',cost:'',st:'att',tva:S.cfg.tva?n(S.cfg.tvr):0,rm:''};S.docs.unshift(d);save('docs');save('seq');go('e',d.id)}
function conv(){const d=cur(),y=new Date().getFullYear(),k='f'+y,q=S.seq[k]=(S.seq[k]||0)+1,f=JSON.parse(JSON.stringify(d));Object.assign(f,{id:nw(),t:'f',num:'FAC-'+y+'-'+String(q).padStart(3,'0'),date:td(),ref:d.num,paid:false,pd:''});d.st='fac';S.docs.unshift(f);save('docs');save('seq');go('e',f.id);toast('Facture créée depuis le devis')}
const ln=(k,l,i)=>`<div class="ln"><input class="dg" list="cat" placeholder="Désignation" value="${esc(l.d)}" oninput="sl('${k}',${i},'d',this.value)"><input inputmode="decimal" placeholder="Qté" value="${esc(l.q)}" oninput="sl('${k}',${i},'q',this.value)"><input id="p${k}${i}" inputmode="decimal" placeholder="Prix €" value="${esc(l.p)}" oninput="sl('${k}',${i},'p',this.value)"><b class="mt" id="m${k}${i}">${E(n(l.q)*n(l.p))}</b><div class="act"><button class="b gh sm" onclick="fv('${k}',${i})"><span>Enregistrer le tarif</span></button><button class="b gh sm" onclick="rl('${k}',${i})"><span>Retirer la ligne</span></button></div></div>`;
const totH=d=>{const T=tot(d);return `<div class="tr"><span>Fournitures</span><b>${E(sum(d.F))}</b></div><div class="tr"><span>Main-d'œuvre</span><b>${E(sum(d.M))}</b></div>${T.m?`<div class="tr"><span>Remise (${esc(d.rm)} %)</span><b class="rd">− ${E(T.m)}</b></div>`:''}${n(d.tva)?`<div class="tr"><span>Total HT</span><b>${E(T.ht)}</b></div><div class="tr"><span>TVA ${esc(d.tva)} %</span><b>${E(T.tv)}</b></div><div class="tr big"><span>Total TTC</span><b>${E(T.t)}</b></div>`:`<div class="tr big"><span>Total net</span><b>${E(T.t)}</b></div><small class="mu">${esc(S.cfg.mt)}</small>`}<div class="tr"><span>Acompte (${esc(d.acc)} %)</span><b>${E(T.a)}</b></div>${d.ap?`<div class="tr"><span>Acompte reçu</span><b class="ok">− ${E(T.a)}</b></div>`:''}<div class="tr big"><span>Reste à payer</span><b class="${d.paid?'ok':'rd'}">${E(T.r)}</b></div>${d.paid?'<span class="bd st">PAYÉ</span>':''}`};
function edit(){const d=cur(),f=d.t==='f',I=(l,k,ty='text',x='')=>`<label>${l}<input type="${ty}" ${x} value="${esc(d[k])}" oninput="sd('${k}',this.value)"></label>`;
return `<datalist id="cat">${S.cat.map(c=>`<option value="${esc(c.d)}">`).join('')}</datalist>
<div class="c"><button class="b gh sm" onclick="go('${d.t}')">‹ Retour</button><h3 style="margin-top:12px">${f?'Facture':'Devis'}</h3><div class="g2">${I('Numéro','num')}${I('Date','date','date')}</div>${f?(d.ref?I('Réf. devis','ref'):''):I('Validité (jours)','val','number','inputmode="numeric"')}</div>
<div class="c"><h3>Client</h3><label>Client enregistré<select onchange="pk(this.value)"><option value="">— Choisir —</option>${S.clients.map(c=>`<option value="${c.id}">${esc(c.n)}</option>`).join('')}</select></label>${I('Nom','cn')}${I('Adresse','ca')}<div class="g2">${I('Code postal Ville','cc')}${I('Tél.','ct','tel')}</div><button class="b gh sm" onclick="svc()">Enregistrer ce client</button>
<h3 style="margin-top:16px">Adresse du chantier</h3>${I('Nom','sn')}${I('Adresse','sa')}${I('Code postal Ville','sc')}<button class="b gh sm" onclick="same()">Identique au client</button></div>
<div class="c"><h3>Objet</h3><textarea rows="3" oninput="sd('o',this.value)">${esc(d.o)}</textarea></div>
${[['F','Fournitures & matériels'],['M',"Main-d'œuvre & interventions techniques"]].map(([k,h])=>`<div class="c"><h3>${h}</h3>${d[k].map((l,i)=>ln(k,l,i)).join('')}<button class="b gh sm" onclick="al('${k}')">＋ Ajouter une ligne</button>${catSel(k)}</div>`).join('')}
<div class="c" id="tots">${totH(d)}</div>
<div class="c"><h3>Suivi</h3>${f?'':`<label class="tg"><input type="checkbox" ${d.st==='ok'?'checked':''} onchange="sd('st',this.checked?'ok':'att')">Devis accepté</label>`}
<label class="tg"><input type="checkbox" ${d.ap?'checked':''} onchange="sd('ap',this.checked)">Acompte reçu</label>
<label style="margin-top:8px">Acompte (%)<input inputmode="decimal" value="${esc(d.acc)}" oninput="sd('acc',n(this.value))"></label>
${f?`<label class="tg"><input type="checkbox" ${d.paid?'checked':''} onchange="pay(this.checked);render()">Facture payée (tampon PAYÉ rouge)</label>`:''}
<div class="g2" style="margin-top:8px"><label>Remise (%)<input inputmode="decimal" value="${esc(d.rm??'')}" oninput="sd('rm',this.value)"></label><label>TVA (%) — 0 = non applicable<input inputmode="decimal" value="${esc(d.tva??0)}" oninput="sd('tva',this.value)"></label></div><label>Remarques (visibles sur le document)<textarea rows="2" oninput="sd('nt',this.value)">${esc(d.nt)}</textarea></label><label style="margin-top:8px">Achats matériel réels, pour le bénéfice (€)<input inputmode="decimal" value="${esc(d.cost)}" oninput="sd('cost',this.value)"></label>
<div class="g2" style="margin-top:8px"><button class="b gh sm" onclick="mailC()">Envoyer par e-mail au client</button><button class="b gh sm" onclick="plFromDoc()">Planifier l'intervention</button></div><div class="g2" style="margin-top:8px"><button class="b gh sm" onclick="go('a')">Importer des lignes (Assistant)</button><button class="b gh sm" onclick="dup()">Dupliquer</button></div><div style="margin-top:8px"><button class="b rd sm" style="width:100%" data-t="Supprimer définitivement" onclick="arm2(this,rm)">Supprimer définitivement</button></div></div>`}
function sd(k,v){cur()[k]=v;save('docs');tt()}
function tt(){const d=cur();if(!d)return;for(const k of['F','M'])d[k].forEach((l,i)=>{const e=$('#m'+k+i);if(e)e.textContent=E(n(l.q)*n(l.p))});const e=$('#tots');if(e)e.innerHTML=totH(d)}
function sl(k,i,f,v){const l=cur()[k][i];l[f]=v;if(f==='d'){const c=S.cat.find(c=>c.d===v);if(c&&!n(l.p)){l.p=c.p;$('#p'+k+i).value=c.p}}save('docs');tt()}
function al(k){cur()[k].push({d:'',q:1,p:''});save('docs');render()}
function rl(k,i){cur()[k].splice(i,1);save('docs');render()}
function fv(k,i){const l=cur()[k][i];if(!l.d)return toast('Écris une désignation');const c=S.cat.find(c=>c.d===l.d);if(c)c.p=l.p;else S.cat.push({d:l.d,t:k,p:l.p});save('cat');$('#cat').innerHTML=S.cat.map(c=>`<option value="${esc(c.d)}">`).join('');toast('Enregistré dans Mes tarifs')}
function pk(id){const c=S.clients.find(c=>c.id===id),d=cur();if(!c)return;Object.assign(d,{cn:c.n,ca:c.a,cc:c.c,ct:c.t});if(!d.sn&&!d.sa)Object.assign(d,{sn:c.n,sa:c.a,sc:c.c});save('docs');render()}
function svc(){const d=cur();if(!d.cn)return toast('Renseigne le nom du client');let c=S.clients.find(c=>c.n===d.cn);if(!c)S.clients.push(c={id:nw(),n:d.cn,e:''});Object.assign(c,{a:d.ca,c:d.cc,t:d.ct});save('clients');render();toast('Client enregistré')}
function same(){const d=cur();Object.assign(d,{sn:d.cn,sa:d.ca,sc:d.cc});save('docs');render()}
function pay(ck){const d=cur();d.paid=ck;d.pd=ck?td():'';save('docs');tt()}
function rm(){const t=cur().t;S.docs=S.docs.filter(x=>x.id!==V.id);save('docs');go(t)}
function cli(){return S.clients.length?S.clients.map(c=>`<button class="r" onclick="go('ce','${c.id}')"><div><b>${esc(c.n)}</b><br><small class="mu">${esc(c.c)} ${esc(c.t)}</small></div><span class="mu">›</span></button>`).join(''):'<p class="mu">Aucun client. Appuie sur ＋ ou enregistre-le depuis un devis.</p>'}
