.b,button.b{border-radius:980px;font-weight:600;letter-spacing:-.01em;min-height:48px;background:var(--ink);color:var(--bg)!important;transition:transform .12s,opacity .12s}.b:active{transform:scale(.97);opacity:.85}
button.b{color:var(--bg)!important}
.b.cu,button.b.cu{background:var(--cu)!important;color:#fff!important}.b.rd{background:var(--rd)}.b.gh,button.b.gh{background:var(--in);color:var(--ink)!important;border:0}
.b.sm{min-height:40px;padding:8px 14px}.b.sm span{font-size:15px}
.bd{border-radius:980px;font-weight:600;font-size:12px}
#bar{background:color-mix(in srgb,var(--cd) 82%,transparent);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-radius:26px;box-shadow:0 10px 40px #0000001f,0 0 0 1px var(--ln)}
#ts{background:var(--ink);color:var(--bg);font-weight:500}
.ln{border-top:1px solid var(--ln)}
.bub{border-radius:20px;box-shadow:none}.bub.u{background:var(--ac);color:#fff}.bub.a{background:var(--cd)}
.cmp{border-radius:24px;box-shadow:0 10px 40px #0000001f,0 0 0 1px var(--ln)}
.qc{border-radius:14px}
.flt input,.flt select{background:var(--cd)}
.b1{background:#b9783f33}.b1 i{background:var(--cu)}
#pv{background:#000000cc}.pvb{background:color-mix(in srgb,var(--bg) 85%,transparent);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border-bottom:1px solid var(--ln)}
.stamp{opacity:.85}
/* ===== v3.5 — raffinements ===== */
.ni{display:flex;align-items:center;gap:14px}.ni svg{width:22px;height:22px;flex:none;fill:none;stroke:var(--ac);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nver{display:block;color:var(--mu);font-size:12px;padding:14px 16px}.nver a{color:var(--ac);text-decoration:none}
.navtop .toplogo{max-height:44px}
#splash{position:fixed;inset:0;z-index:200;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;transition:opacity .45s ease,visibility .45s}
#splash img{width:112px;height:auto;animation:spl 1s cubic-bezier(.2,.8,.2,1) both}
#splash b{font:600 17px/1.2 -apple-system,BlinkMacSystemFont,"SF Pro Display",Inter,sans-serif;letter-spacing:-.02em;color:var(--ink);opacity:0;animation:spt .6s .35s ease forwards}
#splash p{max-width:300px;margin:0;padding:0 22px;text-align:center;color:var(--mu);font-size:13px;line-height:1.45}
#syncbootretry{margin-top:4px}
#syncbootretry[hidden],#syncbootlogin[hidden]{display:none}
#splash.out{opacity:0;visibility:hidden}
@keyframes spl{from{opacity:0;transform:scale(.82)}to{opacity:1;transform:none}}@keyframes spt{to{opacity:.75}}
.news{position:fixed;inset:0;z-index:70;background:#0006;display:flex;align-items:flex-end;justify-content:center}.news>div{background:var(--bg);border-radius:22px 22px 0 0;padding:22px 20px calc(22px + env(safe-area-inset-bottom,0px));max-width:620px;width:100%;max-height:85vh;overflow:auto}
.news h2{margin:0 0 10px;font-size:22px;letter-spacing:-.03em}.news li{margin:6px 0;line-height:1.4}
/* connexion */
#login{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:24px;transition:opacity .3s}#login.out{opacity:0;pointer-events:none}
.lg{width:100%;max-width:360px;background:var(--cd);border-radius:26px;padding:32px 28px;text-align:center;box-shadow:0 20px 60px #0000001a}
.lgi{width:64px;height:64px;margin:0 auto 12px;display:block}
.lg h1{font-size:22px;font-weight:700;letter-spacing:-.03em;margin:0 0 4px;color:var(--ink)}.lg p{margin:0 0 22px;color:var(--mu);font-size:14px}
.lg label{display:block;text-align:left;margin:0 0 12px}.lg label span{display:block;font-size:12px;font-weight:600;color:var(--mu);margin:0 0 4px 4px}
.lg .rm{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--mu);margin:4px 0 18px}.lg .rm input{width:20px;height:20px;min-height:0;margin:0;accent-color:var(--ac)}
.lg button{width:100%;border:0;border-radius:980px;min-height:50px;background:var(--ac);color:#fff;font:inherit;font-weight:600;font-size:16px}.lg button:disabled{opacity:.6}
.lg small{display:block;min-height:18px;margin-top:12px;color:var(--rd);font-weight:500}
.seg{display:flex;background:#76768033;border-radius:12px;padding:3px;margin-top:10px}.seg button{flex:1;border:0;background:transparent;border-radius:9px;min-height:36px;font:inherit;font-size:14px;font-weight:600;color:var(--mu)}.seg button.on{background:var(--ink);color:var(--bg);box-shadow:0 1px 4px #0003}
.pd.pdf-page{height:1123px;min-height:1123px;max-height:1123px;overflow:hidden;padding:36px 48px 60px;margin:0}
.pd.tight td,.pd.tight th{padding:5px 8px;height:auto}.pd.tight h4{margin:8px 0 4px}.pd.tight hr{margin:10px 0}.pd.tight .bx{margin-bottom:8px}
.ph-mini{display:flex;align-items:center;gap:12px;padding-bottom:8px;margin:0 0 12px;border-bottom:2px solid #b9783f;font-size:12px;line-height:1.35;color:#111}
.ph-mini img{width:64px;height:auto;flex:none}.ph-mini-r{margin-left:auto;text-align:right;color:#3b556a;font-weight:700}
.pd .suite{text-align:right;font-size:10px;color:#3b556a;font-weight:700;margin-top:8px;letter-spacing:.03em}
.pd .ft{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;text-align:left}
.pd .ft span:first-child{min-width:0}.pd .ft .pg{flex:none;color:#3b556a;font-weight:700;white-space:nowrap}
.pdf-stack{width:794px}#pvs .pdf-page{margin-bottom:14px;box-shadow:0 8px 24px #00000022}
#appver{font-size:11px;font-weight:700;opacity:.72;white-space:nowrap;padding:3px 7px;border:1px solid #ffffff55;border-radius:99px}#nv .nver{display:block;padding:18px 22px 0;color:var(--mu);font-size:12px}#nv .nver a{color:var(--cu)}
/* iPhone responsive v6.0 */
@media(max-width:520px){
  html,body{width:100%;max-width:100%;overflow-x:hidden}
  #hd{gap:5px;padding:8px max(10px,env(safe-area-inset-right,0px)) 8px max(10px,env(safe-area-inset-left,0px));min-height:56px}

  main{width:100%;max-width:100%;padding:10px 10px calc(var(--bar-h) + var(--off) + 20px)}
  .c{width:100%;max-width:100%;padding:14px;border-radius:16px}
  #bar{left:8px;right:8px;bottom:max(8px,env(safe-area-inset-bottom,0px));padding:8px;border-radius:20px;gap:7px}
  #bar .b{min-height:48px;padding:9px 6px;font-size:14px;white-space:normal;line-height:1.2}

@media(max-width:380px){

/* Import specific styles */
.import-container {
  display: flex;
  flex-direction: column;
  gap: 12px
}

.file-upload-area {
  border: 2px dashed var(--ln);
  border-radius: 14px;
  padding: 40px 20px;
  text-align: center;
  cursor: pointer;
  transition: all 0.2s;
  background: var(--in)
}

.file-upload-area:hover {
  border-color: var(--cu);
  background: color-mix(in srgb, var(--cu) 10%, var(--in))
}

.file-upload-area.dragover {
  border-color: var(--cu);
  background: color-mix(in srgb, var(--cu) 15%, var(--in))
}

.file-upload-area input[type="file"] {
  display: none
}

.file-upload-label {
  color: var(--mu);
  font-size: 14px;
  margin-bottom: 8px
}

.file-upload-icon {
  font-size: 48px;
  color: var(--cu);
  margin-bottom: 8px
}

.file-list {
  display: flex;
  flex-direction: column;
  gap: 8px
}

.file-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 14px;
  background: var(--cd);
  border: 1px solid var(--ln);
  border-radius: 12px;
  transition: all 0.2s
}

.file-item:hover {
  background: var(--in)
}

.file-icon {
  width: 40px;
  height: 40px;
  background: var(--cu);
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: white;
  font-size: 20px
}

.file-info {
  flex: 1;
  min-width: 0
}

.file-name {
  font-weight: 600;
  color: var(--ink);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis
}

.file-size {
  font-size: 12px;
  color: var(--mu)
}

.file-status {
  font-size: 12px;
  padding: 4px 8px;
  border-radius: 6px;
  background: var(--in);
  color: var(--mu)
}

.file-status.processing { background: var(--cu); color: white }
.file-status.completed { background: var(--ok); color: white }
.file-status.error { background: var(--rd); color: white }

.file-actions {
  display: flex;
  gap: 4px
}

.file-actions button {
  width: 32px;
  height: 32px;
  border: 0;
  background: var(--in);
  border-radius: 8px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--ink);
  transition: all 0.2s
}

.file-actions button:hover {
  background: var(--ln)
}

.file-actions button.delete:hover {
  background: var(--rd);
  color: white
}

.preview-container {
  background: var(--cd);
  border-radius: 14px;
  padding: 16px;
  margin-bottom: 12px;
  overflow-x: auto
}

.preview-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 14px
}

.preview-table th,
.preview-table td {
  padding: 8px 12px;
  text-align: left;
  border-bottom: 1px solid var(--ln)
}

.preview-table th {
  background: var(--in);
  font-weight: 600;
  color: var(--ink)
}

.preview-table td {
  color: var(--ink)
}

.extracted-data {
  display: flex;
  flex-direction: column;
  gap: 12px
}

.client-card {
  background: var(--cd);
  border: 1px solid var(--ln);
  border-radius: 14px;
  padding: 16px
}

.client-card.new-client {
  border-color: var(--cu);
  border-width: 2px
}

.client-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 12px
}

.client-name {
  font-weight: 700;
  font-size: 18px;
  color: var(--ink)
}

.new-client-badge {
  background: var(--cu);
  color: white;
  padding: 4px 12px;
  border-radius: 8px;
  font-size: 12px;
  font-weight: 600
}

.client-info {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 8px
}

.client-info-item {
  display: flex;
  flex-direction: column;
  gap: 2px
}

.client-info-label {
  font-size: 12px;
  color: var(--mu);
  font-weight: 500
}

.client-info-value {
  font-size: 14px;
  color: var(--ink)
}

.address-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
  margin-top: 8px
}

.address-item {
  display: flex;
  align-items: flex-start;
  gap: 8px;
  padding: 8px 12px;
  background: var(--in);
  border-radius: 8px
}

.address-radio {
  margin-top: 2px
}

.address-content {
  flex: 1
}

.address-line {
  font-size: 14px;
  color: var(--ink);
  margin-bottom: 2px
}

.address-type {
  font-size: 12px;
  color: var(--mu)
}

.transfer-options {
  display: flex;
  flex-direction: column;
  gap: 12px
}

.transfer-section {
  background: var(--cd);
  border: 1px solid var(--ln);
  border-radius: 14px;
  padding: 16px
}

.transfer-section h4 {
  margin: 0 0 12px 0;
  font-size: 15px;
  font-weight: 600;
  color: var(--ink)
}

.transfer-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
  gap: 8px
}

.transfer-option {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 12px;
  background: var(--in);
  border: 2px solid var(--ln);
  border-radius: 10px;
  cursor: pointer;
  transition: all 0.2s
}

.transfer-option:hover {
  border-color: var(--cu)
}

.transfer-option.selected {
  border-color: var(--cu);
  background: color-mix(in srgb, var(--cu) 10%, var(--in))
}

.transfer-option input[type="checkbox"] {
  width: 20px;
  height: 20px;
  accent-color: var(--cu)
}

.transfer-option label {
  font-size: 14px;
  color: var(--ink);
  cursor: pointer;
  margin: 0
}

.validation-button {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 16px 24px;
  background: var(--cu);
  color: white;
  border: 0;
  border-radius: 14px;
  font-size: 16px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s;
  margin-top: 8px
}

.validation-button:hover {
  background: color-mix(in srgb, black 20%, var(--cu))
}

.validation-button:disabled {
  opacity: 0.6;
  cursor: not-allowed
}

.validation-icon {
  width: 24px;
  height: 24px;
  background: white;
  border-radius: 6px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--cu);
  font-size: 14px
}

.items-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
  gap: 12px
}

.item-card {
  background: var(--cd);
  border: 1px solid var(--ln);
  border-radius: 12px;
  padding: 12px
}

.item-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 8px
}

.item-type {
  font-size: 12px;
  padding: 4px 8px;
  border-radius: 6px;
  background: var(--cu);
  color: white;
  font-weight: 500
}

.item-name {
  font-weight: 600;
  color: var(--ink);
  margin-bottom: 4px
}

.item-details {
  display: flex;
  flex-direction: column;
  gap: 4px;
  font-size: 13px;
  color: var(--mu)
}

.item-price {
  font-weight: 700;
  color: var(--ink)
}

.item-actions {
  display: flex;
  gap: 4px;
  margin-top: 8px
}

.item-actions button {
  flex: 1;
  padding: 8px 12px;
  border: 0;
  border-radius: 8px;
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.2s
}

.item-actions button.add {
  background: var(--cu);
  color: white
}

.item-actions button.add:hover {
  background: color-mix(in srgb, black 20%, var(--cu))
}

.item-actions button.skip {
  background: var(--in);
  color: var(--ink)
}

.item-actions button.skip:hover {
  background: var(--ln)
}

.search-container {
  position: relative;
  margin-bottom: 12px
}

.search-input {
  width: 100%;
  padding: 12px 16px 12px 40px;
  border: 1.5px solid var(--ln);
  border-radius: 12px;
  font-size: 15px;
  background: var(--cd)
}

.search-icon {
  position: absolute;
  left: 12px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--mu);
  font-size: 18px
}

.results-dropdown {
  position: absolute;
  top: calc(100% + 4px);
  left: 0;
  right: 0;
  background: var(--cd);
  border: 1px solid var(--ln);
  border-radius: 12px;
  max-height: 200px;
  overflow-y: auto;
  z-index: 100;
  display: none
}

.results-dropdown.show {
  display: block
}

.result-item {
  padding: 10px 12px;
  cursor: pointer;
  transition: background 0.2s
}

.result-item:hover {
  background: var(--in)
}

.result-item.highlight {
  background: color-mix(in srgb, var(--cu) 15%, var(--cd))
}

.progress-bar {
  width: 100%;
  height: 4px;
  background: var(--ln);
  border-radius: 2px;
  overflow: hidden;
  margin-top: 8px
}

.progress-fill {
  height: 100%;
  background: var(--cu);
  border-radius: 2px;
  transition: width 0.3s
}
